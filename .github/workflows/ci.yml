name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# GITHUB_TOKEN はリポジトリの読み取りだけに絞る（security V1）
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # 本番依存の high 以上で止める（security V3）。開発依存と moderate 以下は月次保守で扱う
        run: npm audit --omit=dev --audit-level=high

      - name: Build (tsc -b + vite build)
        run: npm run build

  # 秘密情報（トークン・鍵など）がコミットされていないか、全履歴を gitleaks で検査する（security V2）。
  # 公開リポなので GitHub のシークレットスキャンとプッシュ保護も有効。gitleaks は全リポ共通の標準として併用する。
  # 第三者の Action は使わず、公式リリースのバイナリをチェックサムで検証してから実行する。
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 全履歴を検査する

      - name: Install gitleaks (checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$f" "$base/$f"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${f}\$" checksums.txt | sha256sum -c -
          tar xzf "$f" gitleaks

      - name: Scan git history
        # 値はログに出さない（--redact）。誤検知は .gitleaksignore に fingerprint を書いて除外する
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
